name: Build kernel + KernelSU (CPH2127)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Nhánh kernel source (oppo-source)"
        default: "oppo/sm4250_r_11.1_a32"

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # Makefile của OPPO chọn driver/platform theo biến này (bengal = SM4250)
      TARGET_PRODUCT: bengal
      TARGET_BOARD_PLATFORM: bengal
    steps:
      # lấy stock_config.txt nằm trong repo này
      - uses: actions/checkout@v4
        with:
          sparse-checkout: stock_config.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Cài công cụ
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio zip \
            python3 git curl gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # OPPO tách source làm 2 repo: kernel (msm-4.19) và vendor/oplus + techpack.
      # Source kernel dùng symlink ../../../vendor/... nên phải dựng đúng cấu trúc:
      #   android/kernel/msm-4.19  +  android/vendor
      - name: Clone kernel source + vendor modules
        run: |
          mkdir -p android/kernel
          git clone --depth=1 -b "${{ inputs.branch }}" \
            https://github.com/oppo-source/android_kernel_oppo_sm4250.git android/kernel/msm-4.19
          git clone --depth=1 -b "${{ inputs.branch }}" \
            https://github.com/oppo-source/android_kernel_modules_and_devicetree_oppo_sm4250.git mods
          cp -a mods/source/android/vendor android/vendor
          for t in display camera video; do
            rm -rf android/kernel/msm-4.19/techpack/$t
            cp -a mods/source/android/kernel/msm-4.19/techpack/$t android/kernel/msm-4.19/techpack/$t
          done
          cd android/kernel/msm-4.19
          echo "Symlink hỏng: $(find . -xtype l -not -path './.git/*' | wc -l)"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile | head -3

      - name: Clone Clang (Proton)
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      # SukiSU-Ultra: hook bằng KPROBES, hợp kernel 4.19 non-GKI
      - name: Tích hợp KernelSU (SukiSU-Ultra)
        working-directory: android/kernel/msm-4.19
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          ls drivers/kernelsu | head
          # Kernel 4.19 chưa có MODULE_IMPORT_NS; xử lý tại cây source thực tế.
          for d in drivers/kernelsu KernelSU/kernel; do
            if [ -d "$d" ]; then
              grep -rl MODULE_IMPORT_NS "$d" --include='*.c' --include='*.h' \
                | xargs -r sed -i '/MODULE_IMPORT_NS/d'
              if grep -rn MODULE_IMPORT_NS "$d" --include='*.c' --include='*.h'; then
                echo "::error::Vẫn còn MODULE_IMPORT_NS trong $d"
                exit 1
              fi
            fi
          done
          test -f drivers/kernelsu/feature/sucompat.c || {
            echo "::error::Không tìm thấy drivers/kernelsu/feature/sucompat.c"
            find . -path '*/sucompat.c' -print
            exit 1
          }

      # Linux 4.19 của thiết bị này không cung cấp linux/pgtable.h.
      # Thử dùng header kiến trúc ARM64 tương ứng trong sucompat.c.
      - name: Vá pgtable header cho kernel 4.19
        working-directory: android/kernel/msm-4.19
        run: |
          FILE="drivers/kernelsu/feature/sucompat.c"
          if grep -q '^#include <linux/pgtable.h>' "$FILE"; then
            sed -i 's|^#include <linux/pgtable.h>|#include <asm/pgtable.h>|' "$FILE"
          fi
          echo "Các header page-table trong sucompat.c:"
          grep -nE 'pgtable\.h|page\.h' "$FILE" || true
          if grep -q '^#include <linux/pgtable.h>' "$FILE"; then
            echo "::error::Chưa thay được linux/pgtable.h"
            exit 1
          fi

      # Kernel 4.19 không có strncpy_from_user_nofault(); dùng API có sẵn.
      # Kiểm tra số vị trí thay thế để tránh âm thầm bỏ sót khi upstream đổi mã.
      - name: Vá strncpy_from_user cho kernel 4.19
        working-directory: android/kernel/msm-4.19
        run: |
          FILE="drivers/kernelsu/feature/sucompat.c"
          test -f "$FILE" || { echo "::error::Không tìm thấy $FILE"; exit 1; }
          COUNT=$(grep -o 'strncpy_from_user_nofault' "$FILE" | wc -l)
          echo "Số vị trí API cũ: $COUNT"
          test "$COUNT" -eq 2 || {
            echo "::error::Số vị trí strncpy_from_user_nofault khác dự kiến; cần kiểm tra source"
            grep -n 'strncpy_from_user' "$FILE" || true
            exit 1
          }
          sed -i 's/strncpy_from_user_nofault/strncpy_from_user/g' "$FILE"
          if grep -n 'strncpy_from_user_nofault' "$FILE"; then
            echo "::error::Vẫn còn API không tương thích"
            exit 1
          fi
          grep -n 'strncpy_from_user' "$FILE"

      - name: Cấu hình
        working-directory: android/kernel/msm-4.19
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          mkdir -p out
          if [ -f "$GITHUB_WORKSPACE/stock_config.txt" ]; then
            echo "Dùng stock_config.txt (config kernel gốc)"
            cp "$GITHUB_WORKSPACE/stock_config.txt" out/.config
          else
            echo "::warning::Không thấy stock_config.txt, dùng tạm vendor/bengal-perf_defconfig"
            make O=out ARCH=arm64 CC=clang vendor/bengal-perf_defconfig
          fi
          scripts/config --file out/.config \
            -d MODULE_SIG_FORCE -d MODULE_SIG_ALL \
            --set-str LOCALVERSION "-perf" -d LOCALVERSION_AUTO \
            -e KPROBES -e KPROBE_EVENTS -e KALLSYMS -e KALLSYMS_ALL \
            -e OVERLAY_FS -e KSU
          make O=out ARCH=arm64 CC=clang olddefconfig
          grep -E '^CONFIG_(KSU|KPROBES|MODULE_SIG_FORCE|LOCALVERSION)' out/.config
          grep -q '^CONFIG_KSU=y' out/.config || { echo "KSU KHÔNG được bật"; exit 1; }

      - name: Build
        working-directory: android/kernel/msm-4.19
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- 2>&1 | tee build.log
          ls out/arch/arm64/boot/
          strings out/arch/arm64/boot/Image | grep -m1 "Linux version"

      - name: Đóng gói AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          B=android/kernel/msm-4.19/out/arch/arm64/boot
          if   [ -f $B/Image.gz-dtb ]; then cp $B/Image.gz-dtb ak3/
          elif [ -f $B/Image.gz ];     then cp $B/Image.gz ak3/
          else cp $B/Image ak3/; fi
          cd ak3 && rm -rf .git && zip -r9 ../kernel-ksu.zip .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-ksu
          path: |
            kernel-ksu.zip
            android/kernel/msm-4.19/build.log
